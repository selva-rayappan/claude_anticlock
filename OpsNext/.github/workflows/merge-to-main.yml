name: Merge to Main

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opsnext_test
          POSTGRES_USER: opsnext
          POSTGRES_PASSWORD: opsnext_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run API integration tests
        working-directory: apps/api
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
          DATABASE_URL: jdbc:postgresql://localhost:5432/opsnext_test
          DATABASE_USERNAME: opsnext
          DATABASE_PASSWORD: opsnext_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci-only-not-production

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: apps/api/build/reports/tests/

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: integration-tests
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/opsnext/api:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/opsnext/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/opsnext/web:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/opsnext/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-staging.opsnext.io

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name opsnext-staging --region ${{ env.AWS_REGION }}

      - name: Update image tags in Kustomize overlay
        run: |
          cd infra/k8s/overlays/staging
          kustomize edit set image \
            opsnext/api=${{ env.ECR_REGISTRY }}/opsnext/api:${{ env.IMAGE_TAG }} \
            opsnext/web=${{ env.ECR_REGISTRY }}/opsnext/web:${{ env.IMAGE_TAG }}

      - name: Apply to staging
        run: kubectl apply -k infra/k8s/overlays/staging/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api -n opsnext-staging --timeout=300s
          kubectl rollout status deployment/web -n opsnext-staging --timeout=300s

      - name: Smoke test
        run: |
          sleep 10
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://api-staging.opsnext.io/health)
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed — /health returned $STATUS"
            exit 1
          fi
          echo "✅ Staging smoke test passed"
