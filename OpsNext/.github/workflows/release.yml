name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.0)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]
        default: staging

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  VERSION: v${{ github.event.inputs.version }}

jobs:
  validate-version:
    name: Validate version input
    runs-on: ubuntu-latest
    steps:
      - name: Validate semver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Version must be semver (e.g. 1.2.0), got: $VERSION"
            exit 1
          fi
          echo "✅ Version $VERSION is valid"

  build-release:
    name: Build Release Images
    runs-on: ubuntu-latest
    needs: validate-version
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API release image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/opsnext/api:${{ env.VERSION }}
          cache-from: type=gha

      - name: Build & push Web release image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/opsnext/web:${{ env.VERSION }}
          cache-from: type=gha

      - name: Create GitHub release tag
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          release_name: Release ${{ env.VERSION }}
          draft: false
          prerelease: false

  deploy-release:
    name: Deploy Release (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    needs: build-release
    environment: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          CLUSTER="opsnext-${{ github.event.inputs.environment }}"
          aws eks update-kubeconfig --name "$CLUSTER" --region ${{ env.AWS_REGION }}

      - name: Update image tags
        run: |
          ENV="${{ github.event.inputs.environment }}"
          cd infra/k8s/overlays/$ENV
          kustomize edit set image \
            opsnext/api=${{ env.ECR_REGISTRY }}/opsnext/api:${{ env.VERSION }} \
            opsnext/web=${{ env.ECR_REGISTRY }}/opsnext/web:${{ env.VERSION }}

      - name: Deploy
        run: |
          ENV="${{ github.event.inputs.environment }}"
          kubectl apply -k infra/k8s/overlays/$ENV/
          kubectl rollout status deployment/api -n opsnext-$ENV --timeout=600s
          kubectl rollout status deployment/web -n opsnext-$ENV --timeout=600s

      - name: Smoke test
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [ "$ENV" = "production" ]; then
            BASE_URL="https://api.opsnext.io"
          else
            BASE_URL="https://api-staging.opsnext.io"
          fi
          sleep 15
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$BASE_URL/health")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Smoke test failed — /health returned $STATUS"
            exit 1
          fi
          echo "✅ Release ${{ env.VERSION }} deployed to $ENV"

      - name: Notify Slack
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ OpsNext ${{ env.VERSION }} deployed to ${{ github.event.inputs.environment }} by ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOYMENTS_WEBHOOK }}
