version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: opsnext_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsnext
      POSTGRES_PASSWORD: opsnext_dev_password
      POSTGRES_DB: opsnext_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opsnext -d opsnext_platform']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opsnext_redis
    restart: unless-stopped
    command: redis-server --requirepass opsnext_redis_password --save 60 1 --loglevel warning
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'opsnext_redis_password', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:26.0
    container_name: opsnext_typesense
    restart: unless-stopped
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: opsnext_typesense_key
      TYPESENSE_ENABLE_CORS: 'true'
    ports:
      - '8108:8108'
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8108/health']
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: opsnext_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opsnext_minio
      MINIO_ROOT_PASSWORD: opsnext_minio_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  typesense_data:
  minio_data:
