server:
  port: ${PORT:3001}
  servlet:
    context-path: /

spring:
  application:
    name: opsnext-api
  threads:
    virtual:
      enabled: true   # Java 21 Project Loom virtual threads
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/opsnext_platform}
    username: ${DATABASE_USERNAME:opsnext}
    password: ${DATABASE_PASSWORD:opsnext_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false
        default_schema: public
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: public
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:opsnext_redis_password}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  show-actuator: false

logging:
  level:
    root: INFO
    io.opsnext: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET:opsnext-dev-secret-key-must-be-at-least-32-chars-long}
    access-token-expiry-hours: 8
    refresh-token-expiry-days: 30
  cookie:
    domain: ${COOKIE_DOMAIN:localhost}
    secure: ${COOKIE_SECURE:false}
  web-url: ${WEB_URL:http://localhost:3000}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  typesense:
    host: ${TYPESENSE_HOST:localhost}
    port: ${TYPESENSE_PORT:8108}
    api-key: ${TYPESENSE_API_KEY:opsnext_typesense_key}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:opsnext_minio}
    secret-key: ${S3_SECRET_KEY:opsnext_minio_password}
    bucket-imports: ${S3_BUCKET_IMPORTS:opsnext-imports}
    bucket-attachments: ${S3_BUCKET_ATTACHMENTS:opsnext-attachments}
  mail:
    from: ${MAIL_FROM:noreply@opsnext.io}
  account-lockout:
    max-attempts: 5
    duration-minutes: 15
