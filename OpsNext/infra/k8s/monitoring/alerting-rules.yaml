apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: opsnext-alerts
  namespace: opsnext-monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: opsnext.api
      interval: 30s
      rules:
        - alert: APIErrorRateHigh
          expr: |
            rate(http_server_requests_seconds_count{
              namespace=~"opsnext-.*",
              status=~"5.."
            }[5m])
            /
            rate(http_server_requests_seconds_count{
              namespace=~"opsnext-.*"
            }[5m]) > 0.01
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "API error rate above 1%"
            description: "Error rate is {{ $value | humanizePercentage }} for the past 5 minutes."

        - alert: APILatencyP99High
          expr: |
            histogram_quantile(0.99,
              rate(http_server_requests_seconds_bucket{
                namespace=~"opsnext-.*"
              }[5m])
            ) > 2
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "API P99 latency above 2s"
            description: "P99 latency is {{ $value }}s for the past 5 minutes."

        - alert: PodRestartLoop
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace=~"opsnext-.*"
            }[10m]) > 3
          labels:
            severity: warning
            team: devops
          annotations:
            summary: "Pod {{ $labels.pod }} restarting frequently"
            description: "Pod has restarted {{ $value }} times in the last 10 minutes."

    - name: opsnext.database
      interval: 60s
      rules:
        - alert: DBConnectionSaturation
          expr: |
            pg_stat_activity_count{datname="opsnext"}
            /
            pg_settings_max_connections > 0.80
          for: 3m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "PostgreSQL connection pool above 80%"
            description: "Active connections at {{ $value | humanizePercentage }} of max_connections."

    - name: opsnext.redis
      interval: 60s
      rules:
        - alert: RedisMemoryHigh
          expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Redis memory above 85%"
